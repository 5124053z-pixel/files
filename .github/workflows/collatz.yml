name: Collatz Background Search

# 実行タイミング:
# - 8時間ごとに自動実行（cronはUTC基準。日本時間からは9時間後ろにずれます）
# - Actionsタブから手動でも実行可能（workflow_dispatch）
#
# 8時間間隔は必須。6時間だとジョブ長（約5時間55分）とほぼ同じため、
# GitHubのcron遅延で次の実行が前の実行の終了前に始まり、
# 古いmainを掴んだままpushして競合する。
#
# 通知について:
# 何か見つかった場合、ジョブをわざと失敗させることでGitHubから
# 失敗通知メールが届くようにしている（下の「発見チェック」ステップ）。
# GitHubは成功したワークフローについては通知を送らないため、
# 「発見＝ジョブ失敗」にするのが最も確実に気づける方法。
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

# checkpointやログをリポジトリにコミットし直すための書き込み権限
permissions:
  contents: write

jobs:
  run-collatz:
    runs-on: ubuntu-latest
    # cron間隔を空けたうえでの保険。手動実行が自動実行と重なった場合などに、
    # 前の実行が終わるまで待たせてpush競合を防ぐ
    concurrency:
      group: collatz-search
      cancel-in-progress: false
    # GitHub Actionsの1ジョブあたりの上限は6時間。コミット処理ぶんの余裕を残して5時間50分に設定
    timeout-minutes: 350

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      # 時間配分: ループ実在探索3時間 + ランダム探索2時間 + 1997探索10分
      #           + セットアップ/コミット ≒ 5時間20分。
      # ジョブ上限6時間・timeout-minutes 350 に対して余裕を確保する。
      #
      # ランダム探索を5時間15分から2時間に減らしている。1026桁の空間に対して
      # 累計2,953万個（割合 10^-1019）しか見ておらず、記録更新も2026-08-03を
      # 最後に止まっているため、時間を割く価値が薄い。空いた分をループ探索に回す。

      # collatz_cycle_search.py はここでは実行しない。
      # 候補 (k,S) は log2(3) の連分数だけから決まる決定的な結果で、
      # 何度回しても同じ18件が出るだけ。結果は collatz_cycle_hunt.py の
      # TARGETS に反映済みなので、手元で必要になったときに実行すればよい。

      # 各探索は continue-on-error にしている。
      # 発見時スクリプトは sys.exit(1) するが、ここで止めてしまうと
      # 後続の探索が実行されなくなるため。発見の判定は最後にまとめて行う。
      - name: ループ実在探索を実行（3時間の制限付き）
        continue-on-error: true
        env:
          COLLATZ_MAX_RUNTIME_SECONDS: "10800"  # 3時間
        run: python collatz_cycle_hunt.py

      - name: キエーザ数の探索を実行（2時間の制限付き）
        continue-on-error: true
        env:
          COLLATZ_MAX_RUNTIME_SECONDS: "7200"  # 2時間
        run: python collatz_background_search.py

      - name: 1997継ぎ足しの探索を実行（最大10分の制限付き）
        continue-on-error: true
        env:
          COLLATZ_MAX_RUNTIME_SECONDS: "600"  # 10分（お試し用。増やしたければ調整してください）
        run: python collatz_1997_chain.py

      # 探索ステップが失敗・タイムアウトしても、そこまでの進捗は必ず保存する
      - name: 進捗をリポジトリにコミット
        if: always()
        run: |
          git config user.name "collatz-bot"
          git config user.email "collatz-bot@users.noreply.github.com"

          for f in collatz_checkpoint.json collatz_records.log collatz_ANOMALY.log \
                   collatz_1997_checkpoint.json collatz_1997_records.log collatz_1997_ANOMALY.log \
                   collatz_cycle_checkpoint.json collatz_cycle_records.log collatz_cycle_ANOMALY.log \
                   collatz_hunt_checkpoint.json collatz_hunt_records.log collatz_hunt_FOUND.log; do
            if [ -f "$f" ]; then git add "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "変更なし、コミットをスキップ"
            exit 0
          fi

          git commit -m "自動進捗保存 $(date -u '+%Y-%m-%d %H:%M UTC')"

          # 実行中にリモートが進んでいるとpushが弾かれるため、rebaseしてリトライする
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功"
              exit 0
            fi
            echo "push失敗（$i回目）。リモートの変更を取り込んで再試行します"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 5))
          done

          echo "5回試行してもpushできませんでした" >&2
          exit 1

      # 発見があればここでジョブを失敗させ、GitHubから失敗通知メールを飛ばす。
      # 成功したワークフローについてGitHubは通知を送らないため、
      # 「発見＝ジョブ失敗」にしておかないと誰も気づかないまま埋もれる。
      # ログは直前のステップでコミット済みなので、失敗させても失われない。
      - name: 発見チェック（見つかっていたら失敗させて通知する）
        if: always()
        run: |
          # collatz_cycle_ANOMALY.log は対象外。あれは
          # collatz_cycle_search.py が「素朴な議論では棄却できなかった候補」を
          # 記録するもので、18件出るのが正常。異常の合図ではない
          # （そもそもそのスクリプトはこのワークフローでは実行していない）。
          hit=0
          for f in collatz_hunt_FOUND.log collatz_ANOMALY.log \
                   collatz_1997_ANOMALY.log; do
            if [ -s "$f" ]; then
              echo "::error::$f に記録があります"
              echo "--- $f ---"
              cat "$f"
              hit=1
            fi
          done

          if [ "$hit" = "1" ]; then
            echo "何か見つかっています。上のログを確認してください。" >&2
            exit 1
          fi

          echo "発見なし（通常の結果）"
